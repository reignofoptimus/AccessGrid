# Creates a backend and its own private PostgreSQL database together.
services:
  - type: web
    name: accessgrid-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    envVars:
      - key: ACCESSGRID_PRODUCTION
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: accessgrid-db
          property: connectionString
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

databases:
  - name: accessgrid-db
    plan: free
    region: oregon
    postgresMajorVersion: "18"
    databaseName: accessgrid
    user: accessgrid
    ipAllowList: []
